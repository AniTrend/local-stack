---
# x-stack: infrastructure
volumes:
  data:
    name: postgres-data
    labels:
      - "co.anitrend.id=postgres-data"
    driver: local

services:
  postgres:
    container_name: "postgres"
    # Pinned to 17: the postgres-data volume holds a PG17 cluster in the pre-18
    # layout (PGDATA directly at /var/lib/postgresql/data). Postgres 18+ refuses
    # to start against that layout (docker-library/postgres#1259). To move to
    # 18, run a proper 17->18 pg_upgrade first. See AGENTS.md / stacks README.
    image: postgres:17
    networks:
      - default
    volumes:
      - data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    env_file: .env
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.tcp.routers.postgres.rule=HostSNI(`${HOST}`)"
      - "traefik.tcp.routers.postgres.entrypoints=websecure"
      - "traefik.tcp.routers.postgres.service=postgres"
      - "traefik.tcp.routers.postgres.tls=true"
      - "traefik.tcp.routers.postgres.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.tcp.services.postgres.loadbalancer.server.port=${PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: 3

networks:
  default:
    name: traefik
    external: true
