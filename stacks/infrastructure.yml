services:
  apisix_dashboard:
    image: 'apache/apisix-dashboard:3.0.1-alpine'
    networks:
      default:
        aliases:
          - apisix-dashboard
    env_file:
      - ./apisix/api-dashboard/.env
    volumes:
      - './apisix/api-dashboard/config/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro'
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.apisix-dashboard.rule=Host(`${HOST}`)'
      - 'traefik.http.routers.apisix-dashboard.entrypoints=web,websecure'
      - traefik.http.routers.apisix-dashboard.service=apisix-dashboard
      - traefik.http.routers.apisix-dashboard.tls=true
      - 'traefik.http.routers.apisix-dashboard.tls.certresolver=${CERT_RESOLVER}'
      - 'traefik.http.services.apisix-dashboard.loadbalancer.server.port=${PORT}'
    logging:
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test:
        - CMD
        - nc
        - '-z'
        - 127.0.0.1
        - '9000'
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 180s
  etcd:
    image: 'bitnamilegacy/etcd:3.6.4'
    networks:
      default:
        aliases:
          - apisix-etcd
    env_file:
      - ./apisix/etcd/.env
    volumes:
      - 'etcd-data:/bitnami/etcd'
    logging:
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test:
        - CMD-SHELL
        - 'etcdctl endpoint health 2>/dev/null || curl -sf http://localhost:2379/health'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
        window: 120s
  apisix_gateway:
    image: 'apache/apisix:3.18.0-debian'
    networks:
      default:
        aliases:
          - apisix-gateway
    env_file:
      - ./apisix/api-gateway/.env
    volumes:
      - './apisix/api-gateway/config/apisix.yaml:/usr/local/apisix/conf/config.yaml:ro'
      - 'cache:/tmp/apisix-cache/'
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /usr/local/apisix/logs/nginx.pid
      interval: 20s
      timeout: 5s
      retries: 3
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.apisix.rule=Host(`${HOST}`)'
      - 'traefik.http.routers.apisix.entrypoints=web,websecure'
      - traefik.http.routers.apisix.service=apisix
      - traefik.http.routers.apisix.tls=true
      - 'traefik.http.routers.apisix.tls.certresolver=${CERT_RESOLVER}'
      - 'traefik.http.services.apisix.loadbalancer.server.port=${PORT}'
    logging:
      options:
        max-size: 10m
        max-file: 3
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 384M
          cpus: '0.40'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 180s
  mongo:
    image: 'mongo:8.3.8'
    networks:
      default:
        aliases:
          - mongo
    env_file:
      - ./mongo/.env
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    volumes:
      - 'mongo-data:/data/db'
      - 'mongo-data:/data/configdb'
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.tcp.routers.mongo.rule=HostSNI(`${HOST}`)'
      - traefik.tcp.routers.mongo.entrypoints=websecure
      - traefik.tcp.routers.mongo.service=mongo
      - traefik.tcp.routers.mongo.tls=true
      - 'traefik.tcp.routers.mongo.tls.certresolver=${CERT_RESOLVER}'
      - 'traefik.tcp.services.mongo.loadbalancer.server.port=${PORT}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval "db.runCommand({ping:1}).ok ? quit(0) : quit(1)"'
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
