# Infrastructure stack (Swarm)
# NOTE: attach to external overlay network 'traefik-public' created once per swarm host.
# NOTE: no Compose-only keys (container_name, restart, build) are used.

volumes:
  traefik-ssl-certs:
    name: traefik_traefik-ssl-certs
    external: true
  portainer-data:
    name: portainer_portainer-data
    external: true
  apisix-cache:
    name: apisix-cache
    external: true
  etcd-data:
    name: etcd-data
    external: true
  postgres-data:
    name: postgres-data
    external: true
  mongo-data:
    name: mongo_mongo-data
    external: true
  mongo-config:
    name: mongo_mongo-config
    external: true

services:
  traefik:
    image: traefik:v3.5
    command:
      - --accesslog=false
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      default:
        aliases:
          - traefik
    ports:
      - 80:80
      - 443:443
    env_file: ./traefik/.env
    volumes:
      - traefik-ssl-certs:/etc/traefik/certs
      - ./traefik/auth/htpasswd:/etc/htpasswd:ro
      - ./traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/config/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.traefik-ui.rule=Host(`${HOST}`)"
      - "traefik.http.routers.traefik-ui.entrypoints=web,websecure"
      - "traefik.http.routers.traefik-ui.service=api@internal"
      - "traefik.http.routers.traefik-ui.middlewares=sso"
      - "traefik.http.routers.traefik-ui.tls=true"
      - "traefik.http.routers.traefik-ui.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.middlewares.sso.plugin.trauth.domain=${TRUEAUTH_DOMAIN}"
      - "traefik.http.middlewares.sso.plugin.trauth.cookiename=${TRUEAUTH_COOKIE}"
      - "traefik.http.middlewares.sso.plugin.trauth.users=${SSO_CREDENTIALS}"
      - "traefik.http.services.traefik-ui.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.traefik-ui.loadbalancer.healthcheck.path=/dashboard/"
      - "traefik.http.services.traefik-ui.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.traefik-ui.loadbalancer.healthcheck.timeout=2s"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  portainer:
    image: portainer/portainer-ee:2.34.0
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 512M
          cpus: '0.50'
    networks:
      default:
        aliases:
          - portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    env_file: ./portainer/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:${PORT}/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.portainer.rule=Host(`${HOST}`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.portainer.entrypoints=web,websecure"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.portainer.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.portainer.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.portainer.loadbalancer.healthcheck.timeout=2s"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  apisix_etcd:
    image: bitnami/etcd:3.6.4
    networks:
      default:
        aliases:
          - apisix-etcd
    env_file:
      - ./apisix/etcd/.env
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd-data:/bitnami/etcd
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  apisix_gateway:
    image: apache/apisix:3.13.0-debian
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 384M
          cpus: '0.40'
    networks:
      default:
        aliases:
          - apisix-gateway
    env_file:
      - ./apisix/api-gateway/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:${PORT}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./apisix/api-gateway/config/apisix.yaml:/usr/local/apisix/conf/config.yaml:ro
      - apisix-cache:/tmp/apisix-cache/
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.apisix.rule=Host(`${HOST}`)"
      - "traefik.http.routers.apisix.entrypoints=web,websecure"
      - "traefik.http.routers.apisix.service=apisix"
      - "traefik.http.routers.apisix.tls=true"
      - "traefik.http.routers.apisix.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.apisix.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.apisix.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.apisix.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.apisix.loadbalancer.healthcheck.timeout=2s"
    depends_on:
      - apisix_etcd
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  apisix_dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    networks:
      default:
        aliases:
          - apisix-dashboard
    env_file:
      - ./apisix/api-dashboard/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:${PORT}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./apisix/api-dashboard/config/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.apisix-dashboard.rule=Host(`${HOST}`)"
      - "traefik.http.routers.apisix-dashboard.entrypoints=web,websecure"
      - "traefik.http.routers.apisix-dashboard.service=apisix-dashboard"
      - "traefik.http.routers.apisix-dashboard.tls=true"
      - "traefik.http.routers.apisix-dashboard.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.apisix-dashboard.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.apisix-dashboard.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.apisix-dashboard.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.apisix-dashboard.loadbalancer.healthcheck.timeout=2s"
    depends_on:
      - apisix_gateway
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    networks:
      default:
        aliases:
          - postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: ./postgres/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:8.0.13
    networks:
      default:
        aliases:
          - mongo
    env_file:
      - ./mongo/.env
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 800M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.2-alpine
    networks:
      default:
        aliases:
          - redis
    command: redis-server --appendonly yes
    env_file: ./redis/.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: traefik-public
    external: true
