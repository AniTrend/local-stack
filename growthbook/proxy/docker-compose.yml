---
x-stack: platform
services:
  growthbook_proxy:
    container_name: "growthbook-proxy"
    image: growthbook/proxy:v1.4.0
    env_file: .env
    networks:
      - default
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.growth-proxy.rule=Host(`${HOST}`)'
      - 'traefik.http.services.growth-proxy.loadbalancer.server.port=${PORT}'
      - 'traefik.http.routers.growth-proxy.entrypoints=web,websecure'
      - 'traefik.http.routers.growth-proxy.service=growth-proxy'
      - 'traefik.http.routers.growth-proxy.tls=true'
      - 'traefik.http.routers.growth-proxy.tls.certresolver=${CERT_RESOLVER}'
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: 3
    # Image is node:22-slim (Debian) — no curl/wget/nc.
    # Uses Node.js built-in fetch against /healthcheck (returns {"ok": true}).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e
          "fetch('http://127.0.0.1:3300/healthcheck')
            .then(r => r.json())
            .then(d => process.exit(d.ok ? 0 : 1))
            .catch(() => process.exit(1))"
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    name: traefik
    external: true
