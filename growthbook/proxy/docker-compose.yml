---
x-stack: platform
services:
  growthbook_proxy:
    container_name: "growthbook-proxy"
    image: growthbook/proxy:git-efec2de
    env_file: .env
    networks:
      - default
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.growth-proxy.rule=Host(`${HOST}`)'
      - 'traefik.http.services.growth-proxy.loadbalancer.server.port=${PORT}'
      - 'traefik.http.routers.growth-proxy.entrypoints=web,websecure'
      - 'traefik.http.routers.growth-proxy.service=growth-proxy'
      - 'traefik.http.routers.growth-proxy.tls=true'
      - 'traefik.http.routers.growth-proxy.tls.certresolver=${CERT_RESOLVER}'
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: 3
    # Proxy is Go-based (alpine image); /healthcheck endpoint returns HTTP 200.
    # nc -z does a TCP connect check which is more portable than curl/wget.
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 ${PORT} || exit 1']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: traefik
    external: true
