services:
  growthbook:
    networks:
      default:
        aliases:
          - growthbook
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 256M
          cpus: '0.20'
        limits:
          memory: 800M
          cpus: '0.80'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 180s

