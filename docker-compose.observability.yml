# Observability stack (Swarm)
# Services: Prometheus, Grafana, Loki, Tempo, OTel Collector

volumes:
  prometheus-data:
    name: prometheus-data
    driver: local
    external: true
  grafana-data:
    name: grafana-data
    driver: local
    external: true
  loki-data:
    name: loki-data
    driver: local
    external: true
  tempo-data:
    name: tempo-data
    driver: local
    external: true
  beszel-data:
    name: beszel-data
    driver: local
    external: true
  beszel-socket:
    name: beszel-socket
    driver: local
    external: true

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 512M
          cpus: '0.25'
        limits:
          memory: 1200M
          cpus: '0.80'
    networks:
      default:
        aliases:
          - prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=${STORAGE_TSDB_RETENTION_SIZE}'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=3d'
      - '--query.max-concurrency=10'
    volumes:
      - ./observability/prometheus/config/:/etc/prometheus/
      - prometheus-data:/prometheus
    env_file: ./observability/prometheus/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:$PORT/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.prometheus.rule=Host(`${HOST}`)"
      - "traefik.http.routers.prometheus.entrypoints=web,websecure"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.routers.prometheus.middlewares=sso@docker"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.prometheus.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.prometheus.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.prometheus.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.prometheus.loadbalancer.healthcheck.timeout=2s"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.5.5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 800M
    networks:
      default:
        aliases:
          - loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    env_file: ./observability/loki/.env
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.8.2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 600M
    networks:
      default:
        aliases:
          - tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    env_file: ./observability/tempo/.env
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:12.1.1
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
    networks:
      default:
        aliases:
          - grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/config/provisioning/:/etc/grafana/provisioning/
    env_file: ./observability/grafana/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:$PORT/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.grafana.rule=Host(`${HOST}`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.grafana.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.grafana.loadbalancer.healthcheck.path=/login"
      - "traefik.http.services.grafana.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.grafana.loadbalancer.healthcheck.timeout=2s"
    depends_on:
      - prometheus
      - loki
      - tempo
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 384M
          cpus: '0.40'
    networks:
      default:
        aliases:
          - otel-collector
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./observability/otel/config.yaml:/etc/otel-collector/config.yaml
    env_file: ./observability/otel/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.otel.rule=Host(`${HOST}`)"
      - "traefik.http.routers.otel.entrypoints=web,websecure"
      - "traefik.http.routers.otel.service=otel"
      - "traefik.http.routers.otel.middlewares=sso@docker"
      - "traefik.http.routers.otel.tls=true"
      - "traefik.http.routers.otel.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.otel.loadbalancer.server.port=${PORT}"
      - "traefik.http.services.otel.loadbalancer.healthcheck.path=/v1/healthz"
      - "traefik.http.services.otel.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.otel.loadbalancer.healthcheck.timeout=3s"
    depends_on:
      - loki
      - tempo
      - prometheus
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  beszel:
    image: henrygd/beszel:0.12.9
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    networks:
      default:
        aliases:
          - beszel
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    env_file:
      - ./beszel/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:$PORT/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.beszel.rule=Host(`${HOST}`)"
      - "traefik.http.routers.beszel.entrypoints=web,websecure"
      - "traefik.http.services.beszel.loadbalancer.server.port=${PORT}"
      - "traefik.http.routers.beszel.service=beszel"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.beszel.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.beszel.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.beszel.loadbalancer.healthcheck.timeout=3s"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  beszel-agent:
    image: henrygd/beszel-agent:0.12.9
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 96M
    networks:
      default:
        aliases:
          - beszel-agent
    volumes:
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./beszel/.env
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: traefik-public
    external: true
