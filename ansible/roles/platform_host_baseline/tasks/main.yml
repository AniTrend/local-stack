---
- name: Validate supported host and automation key
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] == "24.04"
      - platform_environment in ["lab", "rehearsal", "production"]
      - platform_automation_user == "platform-automation"
      - platform_automation_public_key is string
      - platform_automation_public_key.startswith("ssh-ed25519 ")
      - "'\n' not in platform_automation_public_key"
      - "'\r' not in platform_automation_public_key"
    fail_msg: "The host baseline requires Ubuntu 24.04 and one supplied Ed25519 automation public key."

- name: Install the OS baseline packages
  ansible.builtin.apt:
    name: "{{ platform_host_baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
    install_recommends: false
    fail_on_autoremove: true

- name: Set the system timezone link
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ platform_host_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Set the system timezone name
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ platform_host_timezone }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Create the managed automation account
  ansible.builtin.user:
    name: "{{ platform_automation_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password_lock: true
    state: present

- name: Install the managed automation public key
  ansible.posix.authorized_key:
    user: "{{ platform_automation_user }}"
    key: "{{ platform_automation_public_key }}"
    state: present
    manage_dir: true
    exclusive: true

- name: Install passwordless root escalation for the automation account
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-platform-automation
    content: "{{ platform_automation_user }} ALL=(root) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Create managed platform data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: "{{ platform_host_directories }}"

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install bounded journald storage policy
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-anitrend-platform.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      RuntimeMaxUse=100M
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd journal

- name: Enable synchronized system time
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  when: ansible_facts["service_mgr"] == "systemd"
