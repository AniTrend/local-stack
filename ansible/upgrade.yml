---
- name: Upgrade existing Ubuntu hosts without replaying fresh-host provisioning
  hosts: platform_target
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Require the supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] == "24.04"
        fail_msg: "OS upgrades are supported only for Ubuntu 24.04 hosts."

    - name: Apply safe Ubuntu package upgrades without removing packages
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
        cache_valid_time: 86400
        fail_on_autoremove: true
        lock_timeout: 600
