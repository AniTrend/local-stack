---
x-stack: infrastructure
volumes:
  mongo-data:
    name: mongo_mongo-data
    driver: local

services:
  mongo:
    container_name: "mongo"
    image: mongo:8.3.4
    networks:
      - default
    env_file:
      - .env
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    # Single /data mount covers MongoDB's default dbPath (/data/db) and
    # config DB path (/data/configdb) which are subdirectories of /data.
    volumes:
      - mongo-data:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.tcp.routers.mongo.rule=HostSNI(`${HOST}`)"
      - "traefik.tcp.routers.mongo.entrypoints=websecure"
      - "traefik.tcp.routers.mongo.service=mongo"
      - "traefik.tcp.routers.mongo.tls=true"
      - "traefik.tcp.routers.mongo.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.tcp.services.mongo.loadbalancer.server.port=${PORT}"

networks:
  default:
    name: traefik
    external: true
