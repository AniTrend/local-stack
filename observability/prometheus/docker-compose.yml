---
x-stack: observability
volumes:
  prometheus-data:
    name:
      prometheus-data
    driver: local

services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.12.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=512MB'
    env_file: .env
    volumes:
      - ./config/:/etc/prometheus/
      - prometheus-data:/prometheus
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.prometheus.rule=Host(`${HOST}`)"
      - "traefik.http.routers.prometheus.entrypoints=web,websecure"
      - "traefik.http.routers.prometheus.service=prometheus"
      - "traefik.http.routers.prometheus.middlewares=sso@docker"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.prometheus.loadbalancer.server.port=${PORT}"
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: 3

networks:
  default:
    name: traefik
    external: true
