global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'platform-health'

rule_files:
  - 'alert.rules'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: [traefik:8080]

  - job_name: "apisix"
    scrape_interval: 5s
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ['apisix-gateway:9090']