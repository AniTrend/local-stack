---
volumes:
  loki-data:
    name: loki-data
    driver: local
    # external: true
services:
  loki:
    container_name: loki
    image: grafana/loki:3.6.6
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    env_file: .env
    networks:
      - default
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: traefik
    external: true
