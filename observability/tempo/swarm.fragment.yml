services:
  tempo:
    networks:
      default:
        aliases:
          - tempo
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 256M
        limits:
           memory: 600M
  memcached:
    networks:
      default:
        aliases:
          - memcached
