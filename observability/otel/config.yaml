receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  attributes:
    actions:
    - action: insert
      key: loki.attribute.labels
      value: http_status_code
  resource:
    attributes:
    - action: insert
      key: loki.resource.labels
      value: host_name, container_name

exporters:
  debug:
    verbosity: detailed
  loki:
    endpoint: http://localhost:3100/loki/api/v1/push
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
  otlp:
    endpoint: "tempo:4317"
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp] 