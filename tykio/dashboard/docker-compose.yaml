version: "3"

services:
  tyk_dashboard:
    container_name: "tykio-dashboard"
    image: tykio/tyk-dashboard:v5.3
    networks:
      - default
    ports: 
      - ${PORT}:${PORT}
    env_file: .env
    volumes:
      - ./config/tyk.conf:/opt/tyk-gateway/tyk.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tyk-dashboard.rule=Host(`${HOST}`)"
      - "traefik.http.routers.tyk-dashboard.entrypoints=websecure"
      - "traefik.http.routers.tyk-dashboard.service=tyk-dashboard"
      - "traefik.http.routers.tyk-dashboard.tls=true"
      - "traefik.http.routers.tyk-dashboard.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.tyk-dashboard.loadbalancer.server.port=${PORT}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: traefik
    external: true