services:
  traefik:
    networks:
      default:
        aliases:
          - traefik
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 512M
          cpus: '0.50'
