services:
  anitrend-edge:
    networks:
      default:
        aliases:
          - anitrend-edge
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 128M
          cpus: '0.10'
        limits:
          memory: 384M
          cpus: '0.50'
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 180s

