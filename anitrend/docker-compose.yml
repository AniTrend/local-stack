version: '3'
services:
  django-server:
    image: ghcr.io/anitrend/anitrend:0.1.1
    command: 
      - /usr/src/start-server.sh
    container_name: django-server
    networks:
      - default
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anitrend-graphql.rule=Host(`${HOST}`)"
      - "traefik.http.routers.anitrend-graphql.entrypoints=web,websecure"
      - "traefik.http.routers.anitrend-graphql.service=anitrend-graphql"
      - "traefik.http.routers.anitrend-graphql.tls=true"
      - "traefik.http.routers.anitrend-graphql.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.anitrend-graphql.loadbalancer.server.port=${PORT}"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  django-q:
    image: ghcr.io/anitrend/anitrend:0.1.1
    command: 
      - /usr/src/start-q.sh
    container_name: django-q
    networks:
      - default
    env_file: .env
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: traefik
    external: true
