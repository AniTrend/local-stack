name: Renovate OpenCode gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  gate:
    name: Renovate OpenCode gate
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Collect PR changed files and patch metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .review
          gh pr diff "$PR" --repo "$REPO" --name-only > .review/files.txt
          gh pr diff "$PR" --repo "$REPO" > .review/patch.diff
          gh pr view "$PR" --repo "$REPO" --json title,body,author,baseRefName,headRefName,labels > .review/pr.json

      - name: Build deterministic review context
        run: bash tools/ci/build-renovate-review-context.sh

      - name: Run OpenCode review
        id: opencode
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          model: opencode/deepseek-v4-flash
        with:
          prompt-file: .github/prompts/renovate-docker-risk-review.md
          context-file: .review/context.json
          output-file: .review/opencode-result.json

      - name: Validate OpenCode output schema
        run: python3 tools/ci/validate-opencode-risk-output.py .review/opencode-result.json

      - name: Comment review result
        run: python3 tools/ci/comment-opencode-risk-review.py .review/opencode-result.json "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "${{ github.event.pull_request.number }}"

      - name: Apply PR review decision
        run: python3 tools/ci/apply-opencode-review-decision.py .review/opencode-result.json "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "${{ github.event.pull_request.number }}"
