name: Renovate OpenCode gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  gate:
    name: Renovate OpenCode gate
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      # Checkout the trusted base branch only. Never checkout PR head code under
      # pull_request_target — PR head code is untrusted and must not be executed.
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # PR metadata is fetched via gh CLI (GitHub API), not from the PR head checkout.
      # This is safe under pull_request_target because gh pr diff/view use the API token.
      - name: Collect PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .review
          gh pr diff "$PR" --repo "$REPO" --name-only > .review/files.txt
          gh pr diff "$PR" --repo "$REPO" > .review/patch.diff
          gh pr view "$PR" --repo "$REPO" --json title,body,author,baseRefName,headRefName,labels > .review/pr.json

      - name: Build review context
        run: bash tools/ci/build-renovate-review-context.sh

      - name: Install OpenCode CLI
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode risk review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash tools/ci/run-risk-review.sh

      - name: Validate output
        run: python3 tools/ci/validate-opencode-risk-output.py .review/opencode-result.json

      - name: Comment result
        run: python3 tools/ci/comment-opencode-risk-review.py .review/opencode-result.json "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "${{ github.event.pull_request.number }}"

      - name: Apply decision
        run: python3 tools/ci/apply-opencode-review-decision.py .review/opencode-result.json "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "${{ github.event.pull_request.number }}"
