name: Nightly stack sync

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate stacks and open PR if drifted
    runs-on: ubuntu-latest
    # NOTE: regeneration intentionally keeps the Python toolchain
    # (tools/generate_stacks.py) rather than the `stackctl` CLI. The live CLI's
    # generated output is not yet byte-equivalent to the committed stacks/
    # files (env_file/bind-mount path rewriting, volume `name:` keys, and YAML
    # serialization differ), so a CLI-based regeneration would rewrite stacks
    # with incorrect service paths. Migrate once output parity and an explicit
    # CLI install step are proven.
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install -r tools/requirements.txt

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate YAML with yq
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            yq e '.' "$file" >/dev/null
          done < <(find .github/workflows stacks -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

      - name: Regenerate stacks
        run: python3 tools/generate_stacks.py

      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet stacks/; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            git diff --stat stacks/
          fi

      - name: Open or update PR for drifted stacks
        if: steps.drift.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          signoff: true
          delete-branch: true
          commit-message: "chore(stacks): nightly regeneration from compose sources"
          author: "Author <actions@github.com>"
          title: "chore(stacks): nightly stack regeneration"
          body: |
            Automated PR: stacks/ drifted from compose sources. Generated by the nightly-stack-sync workflow.
            
            Run `./stackctl.sh sync` locally to reproduce the diff (compatibility path; the `stackctl` CLI reports drift differently until output parity is proven).
          branch: chore/nightly-stack-sync
          labels: ":skateboard: skip-changelog"
          assignees: "wax911"
          reviewers: "wax911"
