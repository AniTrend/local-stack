name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main, dev ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Find and run yamllint on compose files
        run: |
          set -euo pipefail
          files=$(git ls-files "**/docker-compose*.yml" "**/docker-compose*.yaml" || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs yamllint
          else
            echo "No compose files found"
          fi

  platform-inventory:
    name: Platform inventory validation
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install inventory test dependencies
        run: python -m pip install -r tools/requirements.txt pytest==8.4.2
      - name: Validate read-only inventory and safety contracts
        run: python -m pytest -q tests/platform

  trivy-scan:
    needs: [lint]
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: 'table'
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  validate-stack:
    needs: [lint]
    name: Validate stack
    runs-on: ubuntu-latest
    # stackctl can emit service mappings in host filesystem traversal order.
    # Compare parsed YAML so drift checks ignore mapping order but catch content changes.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup stackctl CLI
        uses: ./.github/actions/setup-stackctl
      - name: Generate Linux stack artifacts for parity inspection
        if: github.head_ref == 'chore/nightly-stack-sync-stackctl'
        run: stackctl generate --output-dir /tmp/stacks-check
      - name: Upload Linux stack artifacts for parity inspection
        if: github.head_ref == 'chore/nightly-stack-sync-stackctl'
        uses: actions/upload-artifact@v7
        with:
          name: linux-generated-stacks
          path: /tmp/stacks-check/*.yml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install render dependencies
        run: pip install -r tools/requirements.txt
      - name: Generate stacks for semantic drift check
        run: stackctl generate --output-dir /tmp/stacks-check
      - name: Check stacks are in sync with compose sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          committed_dir = Path("stacks")
          generated_dir = Path("/tmp/stacks-check")
          committed = {path.name: path for path in committed_dir.glob("*.yml")}
          generated = {path.name: path for path in generated_dir.glob("*.yml")}
          if committed.keys() != generated.keys():
              print("Generated stack file set differs from committed stacks.")
              print(f"Missing generated: {sorted(committed.keys() - generated.keys())}")
              print(f"Uncommitted generated: {sorted(generated.keys() - committed.keys())}")
              sys.exit(1)

          drifted = []
          for name in sorted(committed):
              with committed[name].open() as stream:
                  committed_data = yaml.safe_load(stream)
              with generated[name].open() as stream:
                  generated_data = yaml.safe_load(stream)
              if committed_data != generated_data:
                  drifted.append(name)

          if drifted:
              print(f"Stack content drift detected: {', '.join(drifted)}")
              sys.exit(1)
          print("Stacks match generated configuration (mapping order ignored).")
          PY
      - name: Dry-run stack rendering
        run: ./stackctl.sh up --dry-run --no-logs
