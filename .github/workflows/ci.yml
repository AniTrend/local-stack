name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Lint Compose and Ansible YAML
        run: |
          set -euo pipefail
          compose_files=$(git ls-files "**/docker-compose*.yml" "**/docker-compose*.yaml" || true)
          if [ -n "$compose_files" ]; then
            printf '%s\n' "$compose_files" | xargs yamllint
          else
            echo "No compose files found"
          fi
          yamllint -d '{extends: default, rules: {line-length: {max: 120}}}' ansible/

  trivy-scan:
    needs: [lint]
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: 'table'
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  validate-stack:
    needs: [lint]
    name: Validate stack
    runs-on: ubuntu-latest
    # stackctl can emit service mappings in host filesystem traversal order.
    # Compare parsed YAML so drift checks ignore mapping order but catch content changes.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup stackctl CLI
        uses: ./.github/actions/setup-stackctl
      - name: Generate Linux stack artifacts for parity inspection
        if: github.head_ref == 'chore/nightly-stack-sync-stackctl'
        run: stackctl generate --output-dir /tmp/stacks-check
      - name: Upload Linux stack artifacts for parity inspection
        if: github.head_ref == 'chore/nightly-stack-sync-stackctl'
        uses: actions/upload-artifact@v7
        with:
          name: linux-generated-stacks
          path: /tmp/stacks-check/*.yml
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install render dependencies
        run: pip install -r tools/requirements.txt
      - name: Generate stacks for semantic drift check
        run: stackctl generate --output-dir /tmp/stacks-check
      - name: Check stacks are in sync with compose sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          committed_dir = Path("stacks")
          generated_dir = Path("/tmp/stacks-check")
          committed = {path.name: path for path in committed_dir.glob("*.yml")}
          generated = {path.name: path for path in generated_dir.glob("*.yml")}
          if committed.keys() != generated.keys():
              print("Generated stack file set differs from committed stacks.")
              print(f"Missing generated: {sorted(committed.keys() - generated.keys())}")
              print(f"Uncommitted generated: {sorted(generated.keys() - committed.keys())}")
              sys.exit(1)

          drifted = []
          for name in sorted(committed):
              with committed[name].open() as stream:
                  committed_data = yaml.safe_load(stream)
              with generated[name].open() as stream:
                  generated_data = yaml.safe_load(stream)
              if committed_data != generated_data:
                  drifted.append(name)

          if drifted:
              print(f"Stack content drift detected: {', '.join(drifted)}")
              sys.exit(1)
          print("Stacks match generated configuration (mapping order ignored).")
          PY
      - name: Dry-run stack rendering
        run: ./stackctl.sh up --dry-run --no-logs

  platform-lab-offline:
    name: Platform lab offline validation
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLATFORM_ANSIBLE_COLLECTIONS_PATH: .tools/platform/collections
      ANSIBLE_COLLECTIONS_PATH: .tools/platform/collections
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            infra/pulumi/docker/package-lock.json
            infra/pulumi/hcloud/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/platform/requirements.lock
      - name: Create evidence directory
        run: mkdir -p .artifacts/platform/ci
      - name: Install locked Python test toolchain
        run: python -m pip install --require-hashes -r tools/platform/requirements.lock
      - name: Install pinned project-local Ansible collections
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.tools/platform/collections
        run: ansible-galaxy collection install -p .tools/platform/collections -r ansible/requirements.yml
      - name: Install locked Docker Pulumi dependencies
        run: npm exec --yes --package=npm@11.19.1 -- npm ci --prefix infra/pulumi/docker --no-audit --no-fund
      - name: Install locked HCloud Pulumi dependencies
        run: npm exec --yes --package=npm@11.19.1 -- npm ci --prefix infra/pulumi/hcloud --no-audit --no-fund
      - name: Run offline Pulumi and platform tests
        env:
          PYTEST_ADDOPTS: --junitxml=.artifacts/platform/ci/platform-lab-python.xml
        run: >-
          npm exec --yes --package=npm@11.19.1 --
          make platform-pulumi-test ENV=lab
          > .artifacts/platform/ci/platform-pulumi-test.log 2>&1
      - name: Run Docker-backed Ansible Molecule scenario
        env:
          PLATFORM_DOCKER_CONTEXT: default
          PLATFORM_ALLOWED_DOCKER_CONTEXTS: default
        run: >-
          make platform-ansible-test ENV=lab
          > .artifacts/platform/ci/platform-ansible-test.log 2>&1
      - name: Upload non-secret test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-lab-offline-evidence
          path: .artifacts/platform/ci/
          if-no-files-found: ignore
          retention-days: 14
