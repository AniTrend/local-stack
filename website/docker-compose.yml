services:
  website:
    container_name: website
    image: ghcr.io/anitrend/website:0.3.0
    networks:
      - default
    env_file: .env
    labels:
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.website.rule=Host(`${HOST}`)'
      - 'traefik.http.routers.website.entrypoints=web,websecure'
      - 'traefik.http.routers.website.service=website'
      - 'traefik.http.routers.website.tls=true'
      - 'traefik.http.routers.website.tls.certresolver=${CERT_RESOLVER}'
      - 'traefik.http.services.website.loadbalancer.server.port=${PORT}'
    restart: unless-stopped

networks:
  default:
    name: traefik
    external: true
