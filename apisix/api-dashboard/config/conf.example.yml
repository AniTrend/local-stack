conf:
  listen:
    host: 0.0.0.0
    port: 9000
  etcd:
    endpoints: # supports defining multiple etcd host addresses for an etcd cluster
      - apisix-etcd:2379
    prefix: /apisix     # Add prefix for better organization
    timeout: 30         # Add timeout for etcd operations
  log:
    error_log:
      level: ${LOG_LEVEL:-warn}  # Configurable via environment
      file_path: /dev/stdout     # Docker-friendly logging
    access_log:
      file_path: /dev/stdout
      format: "$remote_addr - $remote_user [$time_local] $http_host \"$request\" $status $body_bytes_sent $request_time \"$http_referer\" \"$http_user_agent\""
authentication:
  secret: ${{AUTHENTICATION_SECRET}} # secret for jwt token generation.
  expire_time: ${AUTH_EXPIRE_TIME:-3600} # jwt token expire time, in second
  users:
    - username: ${{USER_PRIMARY_NAME}} # username and password for login `manager api`
      password: ${{USER_PRIMARY_PASSWORD}}
      role: admin
    - username: ${{USER_SECONDARY_NAME}}
      password: ${{USER_SECONDARY_PASSWORD}}
      role: viewer

# Plugin configurations
plugin_attr:
  request-id:
    include_in_response: true
    algorithm: uuid
    header_name: X-Request-Id

  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
    prefer_name: true
    enable_export_server: true

  opentelemetry:
    resource:
      service.name: apisix-dashboard
      service.version: ${SERVICE_VERSION:-1.0.0}
    collector:
      address: ${OPEN_TELEMETRY_COLLECTOR:-http://otel-collector:4318}
      request_timeout: 3

  loki-logger:
    host: ${LOKI_HOST:-http://loki:3100}
    port: ${LOKI_PORT:-3100}
    flush_buffer_size: 4096
    max_retry_count: 2
    retry_delay: 2
    include_req_body: false
    include_resp_body: false
    timeout: 5

