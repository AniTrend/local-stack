---
x-stack: infrastructure
services:
  apisix_dashboard:
    container_name: "apisix-dashboard"
    image: apache/apisix-dashboard:3.0.1-alpine
    networks:
      - default
    env_file:
      - .env
    volumes:
      - ./config/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.apisix-dashboard.rule=Host(`${HOST}`)"
      - "traefik.http.routers.apisix-dashboard.entrypoints=web,websecure"
      - "traefik.http.routers.apisix-dashboard.service=apisix-dashboard"
      - "traefik.http.routers.apisix-dashboard.tls=true"
      - "traefik.http.routers.apisix-dashboard.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.apisix-dashboard.loadbalancer.server.port=${PORT}"
    logging:
      options:
        max-size: "10m"
        max-file: 3
    # Image (Alpine 3.17) has BusyBox nc; no curl/wget.
    # Dashboard exposes GET /ping on port 9000 (manager-api healthz).
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s


networks:
  default:
    name: traefik
    external: true
