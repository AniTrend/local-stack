services:
  apisix_dashboard:
    networks:
      default:
        aliases:
          - apisix-dashboard
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 180s
