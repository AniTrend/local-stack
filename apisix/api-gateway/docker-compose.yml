---
x-stack: infrastructure
volumes:
  cache:
    name: apisix-cache
    labels:
      - "co.anitrend.id=apisix-cache"
    driver: local

services:
  apisix_gateway:
    container_name: "apisix-gateway"
    image: apache/apisix:3.16.0-debian
    networks:
      - default
    env_file:
      - .env
    volumes:
      - ./config/apisix.yaml:/usr/local/apisix/conf/config.yaml:ro
      - cache:/tmp/apisix-cache/
    restart: unless-stopped
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE}"
      - "traefik.http.routers.apisix.rule=Host(`${HOST}`)"
      - "traefik.http.routers.apisix.entrypoints=web,websecure"
      - "traefik.http.routers.apisix.service=apisix"
      - "traefik.http.routers.apisix.tls=true"
      - "traefik.http.routers.apisix.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.apisix.loadbalancer.server.port=${PORT}"
    logging:
      options:
        max-size: "10m"
        max-file: 3


networks:
  default:
    name: traefik
    external: true
