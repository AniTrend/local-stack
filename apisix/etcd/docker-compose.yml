---
x-stack: infrastructure
volumes:
  etcd-data:
    name: 'etcd-data'
    labels:
      - "co.anitrend.id=etcd-data"
    driver: local

services:
  etcd:
    container_name: "apisix-etcd"
    image: bitnamilegacy/etcd:3.6.4
    networks:
      - default
    env_file:
      - .env
    volumes:
      - etcd-data:/bitnami/etcd
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: 3
    healthcheck:
      test:
        - CMD-SHELL
        - etcdctl endpoint health 2>/dev/null || curl -sf http://localhost:2379/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  default:
    name: traefik
    external: true
